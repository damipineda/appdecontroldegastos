<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-web-client-id" content="912531826696-1te3udh3il323qvadsrh7sjq7chch7sj.apps.googleusercontent.com">
<script>
window.__IS_MOBILE_APP_MODE = new URLSearchParams(window.location.search).get('mobile_app') === '1';
if (window.__IS_MOBILE_APP_MODE) {
  document.documentElement.classList.add('mobile-app-mode');
}
</script>
<title>Iniciar sesión | Vault Cobalt</title>
<link rel="shortcut icon" href="asset/media/favicon/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="asset/media/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="asset/media/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="asset/media/favicon/apple-icon-180x180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<style>
.login-page-wrapper {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  position: relative;
  overflow: hidden;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: rgba(17, 19, 49, 0.58) !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  border-radius: var(--radius-xl);
  padding: 2.25rem 2.25rem;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 25px rgba(99, 102, 241, 0.1);
  position: relative;
  z-index: 2;
}

.login-back-link {
  color: var(--text-tertiary);
  text-decoration: none;
  font-size: 0.85rem;
  transition: color 0.15s;
  position: relative;
  z-index: 2;
}
.login-back-link:hover {
  color: var(--text-secondary);
}

.auth-divider-text {
  background: #111331; /* matches card transparent background */
  color: var(--text-tertiary);
}
</style>
</head>
<body>

<div class="login-page-wrapper">
  <!-- Orbes decorativos neón -->
  <div class="glow-blob" style="top: -150px; left: -150px;"></div>
  <div class="glow-blob glow-blob-secondary" style="bottom: -150px; right: -150px;"></div>

  <div class="login-card">
    <div class="auth-branding text-center mb-4">
      <span class="auth-brand-mark">
        <img src="asset/media/favicon/android-icon-48x48.png" alt="Logo" width="36" height="36">
      </span>
      <h5 class="modal-title mt-3 mb-1">Vault Cobalt</h5>
      <p class="auth-caption mb-0">Accede a tu observatorio financiero personal.</p>
    </div>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Correo Electrónico</label>
        <input type="email" class="form-control" id="loginEmail" name="login_email" autocomplete="email" required placeholder="tu@email.com">
      </div>
      <div class="mb-3">
        <label class="form-label" for="loginPassword">Contraseña</label>
        <input type="password" class="form-control" id="loginPassword" name="login_password" autocomplete="current-password" required placeholder="********">
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary" id="btnLogin">Iniciar Sesión</button>
        <button type="button" class="btn btn-outline-secondary" id="btnRegister">Registrarse</button>
      </div>
    </form>

    <div class="text-center my-4 position-relative">
      <hr class="position-absolute w-100 m-0" style="top: 50%; z-index: 0;">
      <span class="auth-divider-text px-2 small position-relative" style="z-index: 1;">o continúa con</span>
    </div>

    <div class="d-grid gap-2">
      <button type="button" class="btn btn-auth-google" id="btnLoginGoogle">
        <i class="bi bi-google me-2"></i>Google
      </button>
      <button type="button" class="btn btn-auth-secondary" id="btnLoginFacebook">
        <i class="bi bi-facebook me-2"></i>Facebook
      </button>
    </div>
    <p id="socialLoginHint" class="small text-center mt-2 mb-0 d-none"></p>

    <div id="loginError" class="alert alert-danger mt-3 d-none" role="alert" aria-live="assertive"></div>
    <div id="loginSuccess" class="alert alert-success mt-3 d-none" role="status" aria-live="polite">Registro exitoso. ¡Revisa tu correo!</div>
  </div>

  <a href="index.html" class="login-back-link mt-3" id="backToLanding">
    <i class="bi bi-arrow-left me-1"></i>Volver al inicio
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/login.js"></script>
</body>
</html>
